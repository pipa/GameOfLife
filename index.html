<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Game of Life</title>
    <meta
      name="description"
      content="Conway's Game of Life in the browser: draw cells, load classic patterns, watch them evolve."
    />
    <meta name="theme-color" content="#06081c" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/icon-32.png" />
    <link rel="apple-touch-icon" href="./assets/icon-180.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./src/main.js"></script>
  </head>
  <body>
    <main class="app">
      <a class="back" href="https://pipa.github.io/luismatute-preview/playground/">← Playground</a>
      <header class="hud">
        <h1 class="brand"><img src="./assets/icon-192.png" alt="" width="32" height="32" />Game of Life</h1>
        <dl class="stats">
          <div>
            <dt>Generation</dt>
            <dd id="gen">0</dd>
          </div>
          <div>
            <dt>Alive</dt>
            <dd id="pop">0</dd>
          </div>
        </dl>
      </header>

      <div id="stage" class="stage">
        <canvas
          id="board"
          tabindex="0"
          aria-label="Life grid. Click or drag to draw cells. With the grid focused, arrow keys move a cursor and Enter toggles a cell."
        ></canvas>
        <div id="intro" class="intro">
          <img src="./assets/icon-512.png" alt="" width="140" height="140" />
          <h2>Conway's Game of Life</h2>
          <p>
            Each cell lives with 2 or 3 neighbours and is born with exactly 3. Draw your own or pick a
            pattern.
          </p>
          <button id="intro-start" class="btn primary" type="button">Watch it run</button>
        </div>
      </div>

      <div class="controls" role="toolbar" aria-label="Simulation controls">
        <button id="play" class="btn primary" type="button" aria-pressed="false">Play</button>
        <button id="step" class="btn" type="button">Step</button>
        <button id="clear" class="btn" type="button">Clear</button>
        <button id="random" class="btn" type="button">Random</button>
      </div>
      <div class="controls">
        <label class="field"
          >Pattern
          <select id="pattern"></select
        ></label>
        <label class="field"
          >Speed <input id="speed" type="range" min="1" max="30" value="12" aria-describedby="speed-out" />
          <output id="speed-out" for="speed"></output
        ></label>
        <label class="field"><input id="wrap" type="checkbox" /> Wrap edges</label>
      </div>
      <p class="hint">Space play/pause · N step · C clear · R random</p>
      <p id="live" class="sr-only" aria-live="polite"></p>
    </main>
    <noscript>Game of Life needs JavaScript.</noscript>
  </body>
</html>
